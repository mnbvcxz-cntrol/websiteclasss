<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Definitions for luxury metallic gradients and drop shadow -->
  <defs>
    <linearGradient id="goldGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#8a765d"/>
      <stop offset="35%" stop-color="#b89f7d"/>
      <stop offset="70%" stop-color="#6a5c48"/>
      <stop offset="100%" stop-color="#463a2c"/>
    </linearGradient>
    <linearGradient id="bgSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f3ede3"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1e140d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="60" cy="60" r="56" fill="url(#bgSeal)" stroke="url(#goldGradient)" stroke-width="2" filter="url(#subtleShadow)"/>

  <!-- Artisan Stitched Perforation Ring (Stitch Maison Theme) -->
  <circle cx="60" cy="60" r="50" stroke="#b89f7d" stroke-width="1.2" stroke-dasharray="3.5 2.5" opacity="0.85"/>

  <!-- Inner Fine Accent Ring -->
  <circle cx="60" cy="60" r="44.5" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.6"/>

  <!-- Botanical Olive Laurel Sprigs -->
  <!-- Left Sprig -->
  <path d="M 33 66 C 30 52 35 38 48 30" stroke="#6a5c48" stroke-width="1" stroke-linecap="round"/>
  <path d="M 33.5 59 C 29 57 28 52 33 50 C 35 52 35 56 33.5 59 Z" fill="#8a765d" opacity="0.85"/>
  <path d="M 36.5 49 C 33 46 33 41 38 40 C 40 42 39 46 36.5 49 Z" fill="#8a765d" opacity="0.85"/>
  <path d="M 42 40 C 39 37 41 32 46 32 C 47 35 45 38 42 40 Z" fill="#8a765d" opacity="0.85"/>

  <!-- Right Sprig -->
  <path d="M 87 66 C 90 52 85 38 72 30" stroke="#6a5c48" stroke-width="1" stroke-linecap="round"/>
  <path d="M 86.5 59 C 91 57 92 52 87 50 C 85 52 85 56 86.5 59 Z" fill="#8a765d" opacity="0.85"/>
  <path d="M 83.5 49 C 87 46 87 41 82 40 C 80 42 81 46 83.5 49 Z" fill="#8a765d" opacity="0.85"/>
  <path d="M 78 40 C 81 37 79 32 74 32 C 73 35 75 38 78 40 Z" fill="#8a765d" opacity="0.85"/>

  <!-- Center Atelier Monogram: Elegant Interlocking 'M' & Needle -->
  <!-- Tailored Serif M -->
  <path d="M 42 78 L 42 47 L 50.5 47 L 60 67 L 69.5 47 L 78 47 L 78 78 L 72.5 78 L 72.5 55.5 L 63 76 L 57 76 L 47.5 55.5 L 47.5 78 Z" fill="url(#goldGradient)"/>
  
  <!-- Stylized Thread Ribbon Underneath -->
  <path d="M 40 83 Q 60 87 80 83" stroke="#8a765d" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  
  <!-- Top Heritage Star Accent -->
  <polygon points="60,23 62,27.5 66.5,28 63,31 64,35.5 60,33 56,35.5 57,31 53.5,28 58,27.5" fill="url(#goldGradient)"/>
</svg>
